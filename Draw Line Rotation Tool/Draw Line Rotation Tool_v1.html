<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draw Line Rotation Tool — level any photo by eye</title>
<style>
  :root{
    --bg: #14171a;
    --panel: #1b1f23;
    --line: #2a2f34;
    --ink: #e8e6e1;
    --dim: #8b9198;
    --magenta: #ff2ea6;
    --cyan: #35d0d0;
    --mono: 'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    --sans: 'Inter', 'Helvetica Neue', Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--ink);
    font-family:var(--sans);
  }
  .app{
    display:flex; flex-direction:column; align-items:center;
    min-height:100%; padding:32px 16px 64px;
  }
  header{
    width:100%; max-width:920px; margin-bottom:22px;
    display:flex; align-items:baseline; justify-content:space-between; gap:16px;
    border-bottom:1px solid var(--line); padding-bottom:16px;
  }
  h1{
    font-size:19px; font-weight:600; letter-spacing:0.01em; margin:0;
  }
  h1 span{ color:var(--magenta); }
  .sub{
    font-size:12.5px; color:var(--dim); margin:0; font-family:var(--mono);
  }
  .stage{
    width:100%; max-width:920px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:20px;
  }
  .dropzone{
    border:1.5px dashed var(--line);
    border-radius:8px;
    padding:64px 20px;
    text-align:center;
    color:var(--dim);
    cursor:pointer;
    transition:border-color .15s, color .15s;
    font-size:14px;
  }
  .dropzone:hover, .dropzone.drag{
    border-color:var(--magenta);
    color:var(--ink);
  }
  .dropzone strong{ color:var(--ink); font-weight:600; }
  .dropzone .formats{
    margin-top:10px; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    color:#5b6167; font-family:var(--mono);
  }
  input[type=file]{ display:none; }

  .canvas-wrap{
    position:relative;
    display:flex; justify-content:center;
    background:
      linear-gradient(45deg, #202429 25%, transparent 25%) -12px 0/24px 24px,
      linear-gradient(-45deg, #202429 25%, transparent 25%) -12px 0/24px 24px,
      linear-gradient(45deg, transparent 75%, #202429 75%) -12px 0/24px 24px,
      linear-gradient(-45deg, transparent 75%, #202429 75%) -12px 0/24px 24px,
      #191c1f;
    border-radius:6px;
    overflow:hidden;
    touch-action:none;
  }
  canvas{ display:block; max-width:100%; cursor:crosshair; }

  .instructions{
    margin:14px 2px 0; font-size:13px; color:var(--dim); line-height:1.5;
  }
  .instructions b{ color:var(--ink); }

  .readout-row{
    display:flex; align-items:center; gap:18px;
    margin-top:16px; padding-top:16px; border-top:1px solid var(--line);
    flex-wrap:wrap;
  }
  .level{
    position:relative; width:110px; height:28px;
    border:1px solid var(--line); border-radius:14px;
    background:#101315;
    overflow:hidden; flex:none;
  }
  .level::before{
    content:''; position:absolute; left:50%; top:0; bottom:0; width:1px;
    background:var(--line);
  }
  .bubble{
    position:absolute; top:3px; width:22px; height:22px; border-radius:50%;
    background:var(--dim); transform:translateX(-50%);
    left:50%;
    transition:background .15s;
  }
  .bubble.locked{ background:var(--cyan); }

  .angle-readout{
    font-family:var(--mono); font-size:22px; letter-spacing:-0.01em;
    min-width:92px;
  }
  .angle-readout .unit{ font-size:13px; color:var(--dim); }
  .angle-label{ font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; margin-bottom:2px;}

  .spacer{ flex:1; }

  button{
    font-family:var(--sans); font-size:13.5px; font-weight:600;
    border-radius:7px; border:1px solid transparent;
    padding:10px 18px; cursor:pointer;
    transition:filter .12s, opacity .12s;
  }
  button:active{ filter:brightness(0.9); }
  button:disabled{ opacity:.35; cursor:not-allowed; }

  .btn-primary{ background:var(--magenta); color:#1a0512; }
  .btn-primary:hover:not(:disabled){ filter:brightness(1.08); }
  .btn-ghost{ background:transparent; color:var(--dim); border-color:var(--line); }
  .btn-ghost:hover:not(:disabled){ color:var(--ink); border-color:var(--dim); }

  .result-panel{
    margin-top:22px; padding-top:20px; border-top:1px solid var(--line);
    display:none;
  }
  .result-panel.show{ display:block; }
  .result-panel h2{
    font-size:12px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--dim); font-weight:600; margin:0 0 12px;
  }
  .result-canvas-wrap{
    display:flex; justify-content:center; background:#101315;
    border-radius:6px; padding:12px;
  }
  .result-actions{
    display:flex; align-items:center; gap:10px; margin-top:14px;
  }
  .suffix-field{
    display:flex; align-items:center; gap:8px;
    font-size:12px; color:var(--dim);
  }
  .suffix-field input{
    font-family:var(--mono); font-size:13px; color:var(--ink);
    background:#101315; border:1px solid var(--line); border-radius:6px;
    padding:8px 10px; width:150px;
    outline:none;
  }
  .suffix-field input:focus{ border-color:var(--magenta); }
  .filename-preview{
    margin:10px 2px 0; font-size:12px; color:var(--dim); font-family:var(--mono);
    text-align:right;
  }
  a.download-link{ text-decoration:none; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Draw Line Rotation Tool<span>·</span></h1>
      <p class="sub">draw the tilt → rotate to horizontal</p>
    </div>
    <p class="sub" id="dimsReadout"></p>
  </header>

  <div class="stage">
    <div id="dropzone" class="dropzone">
      <div><strong>Click to upload</strong> or drag an image here</div>
      <div class="formats">JPEG · PNG · TIFF</div>
    </div>
    <input type="file" id="fileInput" accept="image/*,.tif,.tiff,image/tiff">

    <div class="canvas-wrap" id="canvasWrap" style="display:none;">
      <canvas id="editCanvas"></canvas>
    </div>

    <p class="instructions" id="instructions" style="display:none;">
      Drag across anything that should be <b>horizontal</b> — a horizon, a wall edge, a shelf — to draw a magenta reference line. Then press <b>Straighten</b>.
    </p>

    <div class="readout-row" id="readoutRow" style="display:none;">
      <div>
        <div class="angle-label">Tilt</div>
        <div class="angle-readout"><span id="angleValue">—</span><span class="unit">°</span></div>
      </div>
      <div class="level"><div class="bubble" id="bubble"></div></div>
      <div class="spacer"></div>
      <button class="btn-ghost" id="clearBtn">Clear line</button>
      <button class="btn-ghost" id="resetBtn">New image</button>
      <button class="btn-primary" id="straightenBtn" disabled>Straighten →</button>
    </div>

    <div class="result-panel" id="resultPanel">
      <h2>Straightened</h2>
      <div class="result-canvas-wrap">
        <canvas id="resultCanvas"></canvas>
      </div>
      <div class="result-actions">
        <label class="suffix-field">
          <span>Extra suffix</span>
          <input type="text" id="suffixInput" placeholder="optional">
        </label>
        <div class="spacer"></div>
        <a class="download-link" id="downloadLink" download="rotated.png">
          <button class="btn-primary">Download PNG</button>
        </a>
      </div>
      <p class="filename-preview" id="filenamePreview"></p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/utif@3.1.0/UTIF.js"></script>
<script>
(function(){
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const canvasWrap = document.getElementById('canvasWrap');
  const canvas = document.getElementById('editCanvas');
  const ctx = canvas.getContext('2d');
  const instructions = document.getElementById('instructions');
  const readoutRow = document.getElementById('readoutRow');
  const angleValue = document.getElementById('angleValue');
  const bubble = document.getElementById('bubble');
  const clearBtn = document.getElementById('clearBtn');
  const resetBtn = document.getElementById('resetBtn');
  const straightenBtn = document.getElementById('straightenBtn');
  const resultPanel = document.getElementById('resultPanel');
  const resultCanvas = document.getElementById('resultCanvas');
  const downloadLink = document.getElementById('downloadLink');
  const dimsReadout = document.getElementById('dimsReadout');
  const suffixInput = document.getElementById('suffixInput');
  const filenamePreview = document.getElementById('filenamePreview');

  let originalBaseName = 'image';

  let img = null;          // the loaded HTMLImageElement
  let scale = 1;           // display scale factor (canvas px per natural px)
  let line = null;         // {x1,y1,x2,y2} in CANVAS (display) coordinates
  let dragging = false;

  const MAX_W = 860, MAX_H = 560;

  function loadFile(file){
    if(!file) return;
    const isTiff = /\.tiff?$/i.test(file.name) || file.type === 'image/tiff';
    const isRecognizedImage = file.type.startsWith('image/') || isTiff;
    if(!isRecognizedImage) return;

    originalBaseName = file.name.replace(/\.[^/.]+$/, '') || 'image';

    if(isTiff){
      loadTiff(file);
      return;
    }

    const reader = new FileReader();
    reader.onload = e => {
      const image = new Image();
      image.onload = () => setImage(image);
      image.onerror = () => showLoadError('Could not read that image file.');
      image.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function loadTiff(file){
    if(typeof UTIF === 'undefined'){
      showLoadError('TIFF support did not load. Check your connection and try again.');
      return;
    }
    const reader = new FileReader();
    reader.onload = e => {
      try{
        const buffer = e.target.result;
        const ifds = UTIF.decode(buffer);
        if(!ifds || !ifds.length) throw new Error('no image data found in file');
        UTIF.decodeImage(buffer, ifds[0]);
        const rgba = UTIF.toRGBA8(ifds[0]);
        const w = ifds[0].width, h = ifds[0].height;

        const tmp = document.createElement('canvas');
        tmp.width = w; tmp.height = h;
        const tctx = tmp.getContext('2d');
        const imageData = tctx.createImageData(w, h);
        imageData.data.set(rgba);
        tctx.putImageData(imageData, 0, 0);

        const image = new Image();
        image.onload = () => setImage(image);
        image.onerror = () => showLoadError('Could not convert that TIFF file.');
        image.src = tmp.toDataURL('image/png');
      }catch(err){
        showLoadError('Could not read that TIFF file (' + err.message + ').');
      }
    };
    reader.onerror = () => showLoadError('Could not read that file.');
    reader.readAsArrayBuffer(file);
  }

  function showLoadError(message){
    dropzone.querySelector('div').innerHTML = '<strong>' + message + '</strong><br>Click to try a different file.';
  }

  function setImage(image){
    img = image;
    line = null;
    resultPanel.classList.remove('show');

    scale = Math.min(MAX_W / img.naturalWidth, MAX_H / img.naturalHeight, 1);
    canvas.width = Math.round(img.naturalWidth * scale);
    canvas.height = Math.round(img.naturalHeight * scale);

    dropzone.style.display = 'none';
    canvasWrap.style.display = 'flex';
    instructions.style.display = 'block';
    readoutRow.style.display = 'flex';
    dimsReadout.textContent = img.naturalWidth + ' × ' + img.naturalHeight + ' px';

    draw();
    updateReadout();
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    if(line){
      ctx.save();
      ctx.strokeStyle = '#ff2ea6';
      ctx.lineWidth = 2.5;
      ctx.shadowColor = 'rgba(255,46,166,0.6)';
      ctx.shadowBlur = 4;
      ctx.beginPath();
      ctx.moveTo(line.x1, line.y1);
      ctx.lineTo(line.x2, line.y2);
      ctx.stroke();
      [[line.x1,line.y1],[line.x2,line.y2]].forEach(([x,y])=>{
        ctx.beginPath();
        ctx.arc(x,y,4,0,Math.PI*2);
        ctx.fillStyle = '#ff2ea6';
        ctx.fill();
      });
      ctx.restore();
    }
  }

  function currentAngleDeg(){
    if(!line) return 0;
    const dx = line.x2 - line.x1;
    const dy = line.y2 - line.y1;
    return Math.atan2(dy, dx) * 180 / Math.PI;
  }

  function updateReadout(){
    if(!line){
      angleValue.textContent = '—';
      bubble.style.left = '50%';
      bubble.classList.remove('locked');
      straightenBtn.disabled = true;
      return;
    }
    const angle = currentAngleDeg();
    angleValue.textContent = angle.toFixed(1);
    const clamped = Math.max(-45, Math.min(45, angle));
    const pct = 50 + (clamped / 45) * 42;
    bubble.style.left = pct + '%';
    bubble.classList.toggle('locked', Math.abs(angle) < 0.3);
    straightenBtn.disabled = false;
  }

  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: (clientX - rect.left) * scaleX,
      y: (clientY - rect.top) * scaleY
    };
  }

  function startDrag(e){
    if(!img) return;
    e.preventDefault();
    const p = getPos(e);
    line = { x1: p.x, y1: p.y, x2: p.x, y2: p.y };
    dragging = true;
    draw();
    updateReadout();
  }
  function moveDrag(e){
    if(!dragging) return;
    e.preventDefault();
    const p = getPos(e);
    line.x2 = p.x; line.y2 = p.y;
    draw();
    updateReadout();
  }
  function endDrag(){
    dragging = false;
  }

  canvas.addEventListener('mousedown', startDrag);
  canvas.addEventListener('mousemove', moveDrag);
  window.addEventListener('mouseup', endDrag);
  canvas.addEventListener('touchstart', startDrag, {passive:false});
  canvas.addEventListener('touchmove', moveDrag, {passive:false});
  canvas.addEventListener('touchend', endDrag);

  dropzone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => loadFile(e.target.files[0]));

  ['dragover','dragenter'].forEach(ev => dropzone.addEventListener(ev, e=>{
    e.preventDefault(); dropzone.classList.add('drag');
  }));
  ['dragleave','drop'].forEach(ev => dropzone.addEventListener(ev, e=>{
    e.preventDefault(); dropzone.classList.remove('drag');
  }));
  dropzone.addEventListener('drop', e=>{
    const file = e.dataTransfer.files[0];
    loadFile(file);
  });

  clearBtn.addEventListener('click', () => {
    line = null;
    draw();
    updateReadout();
  });

  resetBtn.addEventListener('click', () => {
    img = null; line = null;
    originalBaseName = 'image';
    suffixInput.value = '';
    filenamePreview.textContent = '';
    canvasWrap.style.display = 'none';
    instructions.style.display = 'none';
    readoutRow.style.display = 'none';
    resultPanel.classList.remove('show');
    dropzone.style.display = 'block';
    dropzone.querySelector('div').innerHTML = '<strong>Click to upload</strong> or drag an image here';
    dimsReadout.textContent = '';
    fileInput.value = '';
  });

  function sanitizeSuffix(raw){
    return raw.trim().replace(/\s+/g, '_').replace(/[^a-zA-Z0-9_-]/g, '');
  }

  function buildFilename(){
    const extra = sanitizeSuffix(suffixInput.value);
    return originalBaseName + '_rotated' + (extra ? '_' + extra : '') + '.png';
  }

  function updateFilenamePreview(){
    filenamePreview.textContent = buildFilename();
  }

  suffixInput.addEventListener('input', () => {
    updateFilenamePreview();
    downloadLink.download = buildFilename();
  });

  straightenBtn.addEventListener('click', () => {
    if(!img || !line) return;
    const angleRad = Math.atan2(line.y2 - line.y1, line.x2 - line.x1);

    const w = img.naturalWidth;
    const h = img.naturalHeight;
    const cos = Math.abs(Math.cos(angleRad));
    const sin = Math.abs(Math.sin(angleRad));
    const newW = Math.round(w * cos + h * sin);
    const newH = Math.round(w * sin + h * cos);

    resultCanvas.width = newW;
    resultCanvas.height = newH;
    const rctx = resultCanvas.getContext('2d');
    rctx.clearRect(0,0,newW,newH);
    rctx.fillStyle = '#ffffff';
    rctx.fillRect(0,0,newW,newH);
    rctx.save();
    rctx.translate(newW/2, newH/2);
    rctx.rotate(-angleRad);
    rctx.drawImage(img, -w/2, -h/2, w, h);
    rctx.restore();

    // fit result canvas visually
    resultCanvas.style.maxWidth = '100%';
    resultCanvas.style.height = 'auto';

    downloadLink.href = resultCanvas.toDataURL('image/png');
    downloadLink.download = buildFilename();
    updateFilenamePreview();
    resultPanel.classList.add('show');
    resultPanel.scrollIntoView({behavior:'smooth', block:'nearest'});
  });
})();
</script>
</body>
</html>
